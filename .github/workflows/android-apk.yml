name: Build Violet VPN APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android-native/**'
      - 'package.json'
      - 'vite.config.ts'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: violet-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web UI
        run: |
          npm install --no-audit --no-fund
          npm run build
          mkdir -p android-native/src/main/assets
          cp -a dist/. android-native/src/main/assets/
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true
      - name: Build official XTLS libXray AAR
        run: |
          git clone --depth 1 https://github.com/XTLS/libXray.git ../libXray
          cd ../libXray
          python3 build/main.py android
          test -s libXray.aar
          mkdir -p "$GITHUB_WORKSPACE/android-native/libs"
          cp libXray.aar "$GITHUB_WORKSPACE/android-native/libs/libXray.aar"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK exists
        run: test -s android-native/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Violet-VPN-Android-APK
          path: android-native/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
