name: Build Violet VPN APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Violet-VPN-source-corrected.zip'
      - '.github/workflows/android-apk.yml'
      - 'scripts/apply-public-vpn-sources.py'

permissions:
  contents: write

concurrency:
  group: violet-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Extract the complete corrected source archive
        run: |
          test -s Violet-VPN-source-corrected.zip
          mkdir -p /tmp/violet-source
          unzip -q Violet-VPN-source-corrected.zip -d /tmp/violet-source
          test -f /tmp/violet-source/violet-work/package.json
          test -f /tmp/violet-source/violet-work/android-native/src/main/AndroidManifest.xml
          rsync -a --delete --exclude='.git/' --exclude='/scripts/***' --exclude='/.github/***' /tmp/violet-source/violet-work/ ./
      - name: Apply public VPN source integration
        run: python3 scripts/apply-public-vpn-sources.py
      - name: Upload extracted source for remote review
        uses: actions/upload-artifact@v7
        with:
          name: Violet-VPN-Extracted-Source
          path: |
            .
            !.git/**
            !node_modules/**
            !dist/**
            !android-native/.gradle/**
          if-no-files-found: error
          retention-days: 7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify source and dependency constraints
        run: |
          test -f package.json
          test -f vite.config.ts
          test -f src/main.tsx
          test -f android-native/src/main/AndroidManifest.xml
          node -e "const p=require('./package.json'); if(p.devDependencies.esbuild !== '0.28.2' || p.overrides?.esbuild !== '0.28.2') process.exit(1)"
      - name: Install dependencies and build web UI
        run: |
          npm install --no-audit --no-fund --strict-peer-deps --package-lock=false
          npm ls vite esbuild
          npm test
          npm run lint
          npm run build
          mkdir -p android-native/src/main/assets
          cp -a dist/. android-native/src/main/assets/
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_HOME/licenses"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --verbose "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true
      - name: Build official XTLS libXray AAR
        run: |
          git init ../libXray
          git -C ../libXray remote add origin https://github.com/XTLS/libXray.git
          git -C ../libXray fetch --depth 1 origin 6e33510350d18a9b906495ff81ae9eb572144ddd
          git -C ../libXray checkout --detach FETCH_HEAD
          cd ../libXray
          python3 build/main.py android
          test -s libXray.aar
          mkdir -p "$GITHUB_WORKSPACE/android-native/libs"
          cp libXray.aar "$GITHUB_WORKSPACE/android-native/libs/libXray.aar"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Enable AndroidX for Android build
        run: |
          touch android-native/gradle.properties
          grep -q '^android.useAndroidX=true$' android-native/gradle.properties || echo 'android.useAndroidX=true' >> android-native/gradle.properties
          grep -q '^android.enableJetifier=true$' android-native/gradle.properties || echo 'android.enableJetifier=true' >> android-native/gradle.properties
      - name: Configure signing (stable certificate when configured)
        shell: bash
        env:
          VIOLET_SIGNING_BUNDLE: ${{ secrets.VIOLET_SIGNING_BUNDLE }}
        run: |
          if [ -z "$VIOLET_SIGNING_BUNDLE" ]; then
            echo "No release signing bundle configured; using Android debug signing for this installable test build."
            echo "VIOLET_EXPECTED_CERT_SHA256=" >> "$GITHUB_ENV"
            exit 0
          fi
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          bundle = json.loads(os.environ["VIOLET_SIGNING_BUNDLE"])
          if bundle.get("format") != 1 or bundle.get("keystoreType") != "PKCS12":
              raise SystemExit("Invalid Violet signing bundle format")
          keystore = Path(os.environ["GITHUB_WORKSPACE"]) / "android-native" / "violet-release.p12"
          keystore.write_bytes(base64.b64decode(bundle["keystoreBase64"], validate=True))
          values = {
              "VIOLET_KEYSTORE_PATH": str(keystore),
              "VIOLET_KEYSTORE_PASSWORD": bundle["storePassword"],
              "VIOLET_KEY_PASSWORD": bundle["keyPassword"],
              "VIOLET_KEY_ALIAS": bundle["keyAlias"],
              "VIOLET_EXPECTED_CERT_SHA256": bundle["certificateSha256"],
          }
          for key in ("VIOLET_KEYSTORE_PASSWORD", "VIOLET_KEY_PASSWORD"):
              print(f"::add-mask::{values[key]}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key, value in values.items():
                  env_file.write(f"{key}={value}\n")
          PY
      - name: Assemble debug APK
        run: gradle --no-daemon -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true -p android-native :app:assembleDebug
      - name: Locate and verify APK
        run: |
          echo "Searching for APK produced by Gradle..."
          find . -type f -name '*.apk' -print
          APK_PATH="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -size +0c -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "Gradle reported success but no debug APK was found."
            find . -type d -path '*/build/outputs/*' -print
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          ls -lh "$APK_PATH"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found"; exit 1; fi
          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")"
          printf '%s\n' "$SIGNATURE_OUTPUT"
          ACTUAL_CERT="$(printf '%s\n' "$SIGNATURE_OUTPUT" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT="$(printf '%s' "$VIOLET_EXPECTED_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$ACTUAL_CERT" ]; then echo "APK certificate digest missing"; exit 1; fi
          if [ -n "$EXPECTED_CERT" ]; then
            if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
              echo "APK signer does not match the stable Violet VPN release certificate."
              exit 1
            fi
            echo "Verified stable release certificate: $ACTUAL_CERT"
          else
            echo "Verified installable debug APK signature: $ACTUAL_CERT"
          fi
          cp "$APK_PATH" "$GITHUB_WORKSPACE/Violet-VPN-latest.apk"
          echo "VIOLET_APK_PATH=$GITHUB_WORKSPACE/Violet-VPN-latest.apk" >> "$GITHUB_ENV"
      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: Violet-VPN-Android-APK
          path: ${{ env.VIOLET_APK_PATH }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish installable APK release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: violet-build-${{ github.run_number }}
          name: Violet VPN 2.1.${{ github.run_number }}
          body: |
            Автоматическая Android-сборка Violet VPN.
            Версия Android: 2.1.${{ github.run_number }}
            Код версии Android формируется автоматически и уникален для сборки.
            APK: Violet-VPN-latest.apk
          files: Violet-VPN-latest.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
